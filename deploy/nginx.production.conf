server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name laresidencenoema.com www.laresidencenoema.com;
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://laresidencenoema.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name laresidencenoema.com www.laresidencenoema.com;
    ssl_certificate /etc/letsencrypt/live/laresidencenoema.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laresidencenoema.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    # Do not log password-reset tokens or OAuth authorization codes in URLs.
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=300" always;
    if ($host = www.laresidencenoema.com) {
        return 301 https://laresidencenoema.com$request_uri;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
