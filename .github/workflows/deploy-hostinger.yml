name: Deploy NOEMA to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noema-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r backend/requirements.txt
      - name: Validate frontend and Express
        run: |
          npm run lint
          npm run build
          npm run test:financing
          node --import tsx --test tests/seo.test.ts
          node --test tests/proxy.test.mjs
      - name: Validate Django in an isolated test database
        env:
          DJANGO_DEBUG: 'True'
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py test apps.accounts apps.leads apps.faq --noinput

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Send the validated commit to the restricted VPS receiver
        env:
          NOEMA_DEPLOY_KEY: ${{ secrets.NOEMA_DEPLOY_KEY }}
          NOEMA_KNOWN_HOSTS: ${{ vars.NOEMA_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NOEMA_DEPLOY_KEY" && test -n "$NOEMA_KNOWN_HOSTS"
          umask 077
          access_dir=$(mktemp -d)
          trap 'rm -rf "$access_dir"' EXIT
          printf '%s\n' "$NOEMA_DEPLOY_KEY" > "$access_dir/key"
          printf '%s\n' "$NOEMA_KNOWN_HOSTS" > "$access_dir/known_hosts"
          unset NOEMA_DEPLOY_KEY
          git update-ref refs/heads/noema-deployment "$GITHUB_SHA"
          git bundle create "$access_dir/source.bundle" refs/heads/noema-deployment
          { printf '%s\n' "$GITHUB_SHA"; cat "$access_dir/source.bundle"; } |
            ssh -T -i "$access_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$access_dir/known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              noema-deploy@179.198.220.251 deploy
      - name: Check production from outside the VPS
        run: python deploy/smoke.py https://laresidencenoema.com "$GITHUB_SHA"
